<!DOCTYPE html>
<html>
<body>
<canvas id="myCanvas" width="200" height="200" style="border:1px solid black;"></canvas>
<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

// Functie om een lijn te plotten tussen twee willekeurige punten (x1, y1) en (x2, y2) met een opgegeven kleur
/* 
    Deze functie maakt gebruik van de bresenham line algorithme https://en.wikipedia.org/wiki/Bresenham%27s_line_algorithm
*/
function plotLine(x1, y1, x2, y2, color) {
    var dx = Math.abs(x2 - x1); // Absolute waarde van het verschil in x
    var sx = (x1 < x2) ? 1 : -1; // Als x0 kleiner is beweeg naar rechts anders naar links
    var dy = -Math.abs(y2 - y1); // Absolute waarde van het verschil in y
    var sy = (y1 < y2) ? 1 : -1; // Als y0 kleiner is beweeg naar beneden anders naar boven
    ctx.fillStyle = color;   // Stel de kleur van de lijn

    var error = dx + dy; // beginwaarde voor de fout

    while (true) {
        ctx.fillRect(x1, y1, 1, 1); // Plot een pixel
        if (x1 === x2 && y1 === y2) break; // Stop als we het eindpunt hebben bereikt

        var error2 = 2 * error; // bereken de twee mogelijke fouten

        if (error2 >= dy) { // Check of we in de x righting moeten bewegen
            error = error + dy;
            x1 = x1 + sx; // Beweeg in de x richting
        }
        
        if (error2 <= dx) { // Check of we in de y richting moeten bewegen
            error = error + dx;
            y1 = y1 + sy; // Beweeg in de y richting
        }
    }
}


/* Testcode. NB: de beoordeling wordt gedaan op basis van andere parameter-waarden.
Elke lijn kan een andere kleur krijgen door middel van een 5e parameter. */
// random lijnen
plotLine(20, 40, 50, 70, "red");
plotLine(70, 80, 100, 160, "blue");
plotLine(10, 80, 90, 120, "green");
plotLine(10, 10, 100, 10, "black")
// horizontaal
plotLine(0, 100, 200, 100, "blue");

// verticaal
plotLine(100, 0, 100, 200, "blue");

// diagonale lijnen
plotLine(0, 200, 200, 0, "yellow");
plotLine(200, 0, 0, 200, "yellow");
plotLine(200, 200, 0, 0, "yellow");
plotLine(0, 50, 200, 150, "yellow");
plotLine(50, 0, 150, 200, "yellow");
plotLine(150, 0, 50, 200, "yellow");

plotLine(0, 75, 200, 125, "blue");
plotLine(0, 25, 200, 175, "blue");
plotLine(25, 0, 175, 200, "blue");
plotLine(75, 0, 125, 200, "blue");
plotLine(125, 0, 75, 200, "blue");
plotLine(175, 0, 25, 200, "blue");
plotLine(200, 25, 0, 175, "blue");

plotLine(0, 25, 200, 175, "blue");
plotLine(100, 200, 100, 0, "blue");
plotLine(50, 0, 150, 200, "blue");
plotLine(0, 125, 200, 75, "blue");


// For good measure
plotLine(200, 75, 0, 125, "blue");
plotLine(200, 50, 0, 150, "blue");

</script>
</body>
</html>
